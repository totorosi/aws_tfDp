# ArgoCD 진입점. 이 디렉터리에 kustomization.yaml 이 있으면
# ArgoCD 가 kustomize 로 렌더링합니다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# ECR 이미지로 바꿀 때는 아래 주석을 풀고 값을 채우면
# deployment.yaml 을 건드리지 않아도 됩니다.
# CI 워크플로우가 newTag 를 커밋 SHA 로 갱신하는 방식입니다.
# images:
#   - name: public.ecr.aws/nginx/nginx
#     newName: <계정ID>.dkr.ecr.sa-east-1.amazonaws.com/nginx
#     newTag: <커밋 SHA>
