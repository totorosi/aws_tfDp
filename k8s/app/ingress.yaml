# 이 Ingress 를 AWS Load Balancer Controller 가 보고 ALB 를 만듭니다.
# Terraform 이 aws_lb 를 직접 만들지 않습니다.
#
# ALB 가 뜨는 조건:
#   - LB Controller 가 kube-system 에 떠 있을 것 (modules/eks 가 설치)
#   - public 서브넷에 kubernetes.io/role/elb = 1 태그가 있을 것 (modules/network 가 부여)
#
# [도메인 없음] Route53 을 쓰지 않으므로 host 규칙이 없습니다.
# ALB 기본 주소(...elb.amazonaws.com)로 바로 접속하며, HTTP 80 만 엽니다.
# 접속 주소는 아래 명령으로 확인합니다.
#   kubectl -n web get ingress nginx -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: web
  annotations:
    # internet-facing: 인터넷에서 닿습니다. internal: VPC 안에서만.
    alb.ingress.kubernetes.io/scheme: internet-facing

    # ip: 파드 IP 로 직접 보냅니다. instance: NodePort 를 거칩니다.
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
spec:
  ingressClassName: alb
  rules:
    # host 없는 규칙. ALB 기본 주소로 오는 모든 요청을 받습니다.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
