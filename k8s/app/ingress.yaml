# 이 Ingress 를 AWS Load Balancer Controller 가 보고 ALB 를 만듭니다.
# Terraform 이 aws_lb 를 직접 만들지 않습니다.
#
# ALB 가 뜨는 조건:
#   - LB Controller 가 kube-system 에 떠 있을 것 (modules/eks 가 설치)
#   - public 서브넷에 kubernetes.io/role/elb = 1 태그가 있을 것 (modules/network 가 부여)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx
  namespace: web
  annotations:
    # internet-facing: 인터넷에서 닿습니다. internal: VPC 안에서만.
    alb.ingress.kubernetes.io/scheme: internet-facing

    # ip: 파드 IP 로 직접 보냅니다. instance: NodePort 를 거칩니다.
    alb.ingress.kubernetes.io/target-type: ip

    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/healthcheck-path: /

    # [인증서] certificate-arn 을 적지 않았습니다.
    # LB Controller 는 아래 rules[].host 와 일치하는 ACM 인증서를 자동으로 찾습니다.
    # 와일드카드 인증서(*.totorosi.cloud)가 있으므로 이것만으로 HTTPS 가 붙습니다.
    # ARN 에는 계정 ID 가 들어가는데, 이 저장소는 공개라 적지 않는 편이 낫습니다.

    # HTTP 로 들어온 요청을 HTTPS 로 넘깁니다.
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    # 1) host 를 지정해야 인증서 자동 탐색이 동작합니다.
    #    이 이름으로 Route53 레코드가 있어야 브라우저 경고 없이 열립니다.
    - host: nginx.totorosi.cloud
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80

    # 2) host 없는 규칙(catch-all). 이게 없으면 ALB 기본 주소로 접속했을 때
    #    어떤 host 규칙에도 걸리지 않아 404 가 납니다.
    #    DNS 를 아직 안 걸었어도 ALB 주소로 확인할 수 있게 남겨둡니다.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
