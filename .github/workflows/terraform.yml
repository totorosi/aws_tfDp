# ##################################################################################################
# project-module/projects 를 배포하는 메인 파이프라인
# --------------------------------------------------------------------------------------------------
# [사전 준비]
#  1) remote-backend 디렉터리를 로컬에서 1회 apply 해서 S3 버킷 + DynamoDB 테이블을 먼저 만드세요.
#  2) sa-east-1 리전에 EC2 키 페어를 미리 만들어 두세요.
#  3) GitHub 저장소 > Settings > Secrets and variables > Actions 에 아래 6개를 Secret 으로 등록하세요.
#       AWS_ACCESS_KEY_ID          IAM 사용자의 액세스 키
#       AWS_SECRET_ACCESS_KEY      해당 시크릿 키
#       TF_BACKEND_BUCKET          상태 저장 S3 버킷 이름
#       TF_BACKEND_DYNAMODB_TABLE  상태 잠금 DynamoDB 테이블 이름
#       TF_VAR_OWNER               리소스 이름 접두사 (보통 본인 IAM 사용자명)
#       TF_VAR_KEY_PAIR            EC2 키 페어 이름
#
# 계정 식별 정보는 코드에 남기지 않고 전부 Secret 으로 주입합니다.
# ##################################################################################################
name: Terraform (project-module)

# ==================================================================================================
# 1. 트리거 조건 설정: 어떤 이벤트에서 워크플로우를 실행할지 지정
# ==================================================================================================
on:
  # PR 이 올라오면 plan 만 돌려서 변경 내용을 미리 확인합니다.
  pull_request:
    paths:
      - 'project-module/**'
      - '.github/workflows/terraform.yml'

  # main 브랜치에 push 되면 plan 까지만 자동 실행합니다. (apply 는 수동)
  push:
    branches: [main]
    paths:
      - 'project-module/**'
      - '.github/workflows/terraform.yml'

  # Actions 탭에서 직접 실행 (plan / apply / destroy 선택)
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 terraform 명령'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply
          - destroy

# ==================================================================================================
# 2. 권한 설정 (OpenID Connect 또는 시크릿 접근 권한)
#    - 우리는 액세스 키(시크릿) 방식을 쓰므로 GITHUB_TOKEN 권한만 최소로 제한합니다.
#    - contents: read => 소스 코드 체크아웃에만 필요
#    - 명시하지 않으면 저장소 기본값(넓은 권한)이 그대로 적용되므로 반드시 적어줍니다.
#    - OIDC 방식으로 바꾸려면 여기에 id-token: write 를 추가하고 5번에서 role-to-assume 을 씁니다.
# ==================================================================================================
permissions:
  contents: read
  # OIDC 토큰을 발급받으려면 반드시 필요합니다. 이게 없으면
  # "Credentials could not be loaded" 로 인증 단계가 실패합니다.
  id-token: write

env:
  TF_VERSION: '1.16.1'
  AWS_REGION: 'sa-east-1'
  WORKDIR: 'project-module/projects'
  # plan/apply 시 자동화 환경임을 terraform 에 알립니다.
  TF_IN_AUTOMATION: 'true'
  # 비어 있으면 액세스 키로, 값이 있으면 OIDC 로 인증합니다.
  # secrets 컨텍스트는 step 의 if 조건에서 쓸 수 없어 env 로 옮겨 둡니다.
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  # terraform 은 TF_VAR_<변수명> 형태의 환경변수를 자동으로 변수 값으로 읽습니다.
  # secret.auto.tfvars 가 git 에 없으므로 여기서 Secret 으로 대신 주입합니다.
  TF_VAR_owner: ${{ secrets.TF_VAR_OWNER }}
  TF_VAR_key_pair: ${{ secrets.TF_VAR_KEY_PAIR }}

# 같은 브랜치에서 동시에 돌면 state 잠금(lock) 충돌이 나므로 순차 실행시킵니다.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ github.event.inputs.action || 'plan' }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      # ==========================================================================================
      # 3. 소스 코드 체크아웃 (저장소의 파일을 러너로 다운로드)
      # ===========================================================================================
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v7

      # ==========================================================================================
      # 4. Terraform CLI 도구 설치
      #    AWS CLI 는 ubuntu-latest 러너에 기본 포함되어 있어 따로 설치하지 않습니다.
      # ===========================================================================================
      - name: 도구 설치 (Terraform)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          # plan 결과를 GitHub 요약에 출력하기 위해 wrapper 를 켭니다.
          terraform_wrapper: true

      # ==========================================================================================
      # 5. AWS 인증 정보 설정 (GitHub Secrets 활용)
      # ===========================================================================================
      # OIDC 방식. AWS_ROLE_ARN Secret 이 등록되어 있으면 이쪽이 돕니다.
      # GitHub 이 발급한 서명 토큰으로 역할을 가져오므로 보관되는 키가 없습니다.
      - name: AWS 인증 (OIDC - 권장)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 액세스 키 방식(구). AWS_ROLE_ARN 이 아직 없을 때만 돕니다.
      # OIDC 로 넘어간 뒤에는 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY Secret 을 삭제하세요.
      - name: AWS 인증 (액세스 키 - 폴백)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 인증 확인 (어떤 계정/사용자로 붙었는지 출력)
        run: aws sts get-caller-identity

      # ==========================================================================================
      # 6. 테라폼 초기화 (Provider 다운로드 및 Backend 설정)
      #    backend 의 bucket / dynamodb_table 은 코드에 없으므로 Secret 으로 주입합니다.
      # ===========================================================================================
      - name: 테라폼 초기화 (init)
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"

      # ==========================================================================================
      # 7. 테라폼 코드 포맷 검증
      #    fmt      : 들여쓰기·정렬 규칙 검사 (스타일 문제라 실패해도 파이프라인은 계속 진행)
      #    validate : 문법과 참조 오류 검사 (실패하면 여기서 중단)
      # ===========================================================================================
      - name: 포맷 검사 (fmt)
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: 문법 검증 (validate)
        run: terraform validate -no-color

      # ==========================================================================================
      # 8. 변경 사항 미리보기 (Plan)
      #    무엇이 생성/변경/삭제되는지 미리 확인합니다.
      #    결과를 tfplan 파일로 저장해, 9단계에서 "본 그대로" 반영되도록 합니다.
      # ===========================================================================================
      - name: 변경 미리보기 (plan)
        id: plan
        if: github.event.inputs.action != 'destroy'
        # tee 로 파일에도 남깁니다. 아래 요약 단계가 이 파일을 읽습니다.
        #
        # set -o pipefail 이 없으면 파이프라인의 종료 코드가 tee 의 것이 되어,
        # terraform plan 이 실패해도 이 단계가 성공으로 처리됩니다.
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      # plan 출력을 파일로 넘깁니다.
      #
      # [이전 방식이 왜 깨졌나]
      # steps.plan.outputs.stdout 을 env 로 넘겼더니, 생성 리소스가 90개가 넘는
      # 큰 plan 에서 환경변수가 OS 한계를 넘어 bash 가 시작조차 못 했습니다.
      #   An error occurred trying to start process '/usr/bin/bash' ... Argument list too long
      # 작은 plan 에서는 통과해서 한동안 모르고 지나갔습니다.
      # 파일로 주고받으면 크기와 무관하게 동작합니다.
      - name: plan 결과를 실행 요약에 출력
        if: always() && hashFiles(format('{0}/plan.txt', env.WORKDIR)) != ''
        run: |
          {
            echo '### Terraform Plan'
            echo '```terraform'
            head -c 900000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: plan 파일 아티팩트로 업로드
        if: github.event.inputs.action != 'destroy'
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-${{ github.run_id }}
          path: ${{ env.WORKDIR }}/tfplan
          retention-days: 5

      # ==========================================================================================
      # 9. 인프라 반영 (Apply / Destroy)
      #    Actions 탭에서 직접 실행할 때만 동작합니다. PR/push 로는 절대 반영되지 않습니다.
      #    Apply 는 8단계에서 저장한 tfplan 을 그대로 적용합니다.
      # ===========================================================================================
      - name: 인프라 반영 (apply)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m -auto-approve tfplan

      - name: 인프라 삭제 (destroy)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
        run: terraform destroy -input=false -no-color -lock-timeout=5m -auto-approve
