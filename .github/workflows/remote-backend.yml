# ##################################################################################################
# remote-backend (상태 저장용 S3 버킷 + 상태 잠금용 DynamoDB 테이블) 관리 파이프라인
# --------------------------------------------------------------------------------------------------
# [주의] 이 디렉터리는 "자기가 쓸 backend 를 자기가 만드는" 부트스트랩 코드입니다.
#        따라서 버킷이 아직 없는 최초 1회는 이 워크플로우가 아니라 로컬에서 아래 순서로 실행하세요.
#
#          cd remote-backend
#          cp terraform.tfvars.example terraform.tfvars   # 본인 값 입력
#          cp backend.hcl.example      backend.hcl        # 본인 값 입력
#          # providers.tf 의 backend "s3" 블록을 주석 처리
#          terraform init && terraform apply
#          # 주석 해제 후
#          terraform init -backend-config=backend.hcl -migrate-state
#
#        버킷이 만들어진 뒤부터는 이 워크플로우로 관리하면 됩니다.
# ##################################################################################################
name: Terraform (remote-backend)

# ==================================================================================================
# 1. 트리거 조건 설정
#    상태 저장소는 실수로 바뀌면 위험하므로 자동 실행 없이 수동으로만 돌립니다.
# ==================================================================================================
on:
  workflow_dispatch:
    inputs:
      action:
        description: '실행할 terraform 명령 (destroy 는 버킷에 prevent_destroy 가 걸려 있어 막힙니다)'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - apply

# ==================================================================================================
# 2. 권한 설정
#    GITHUB_TOKEN 에 줄 권한을 최소로 제한합니다. (체크아웃에 필요한 읽기 권한만)
# ==================================================================================================
permissions:
  contents: read
  # OIDC 토큰을 발급받으려면 반드시 필요합니다. 이게 없으면
  # "Credentials could not be loaded" 로 인증 단계가 실패합니다.
  id-token: write

env:
  TF_VERSION: '1.16.1'
  AWS_REGION: 'sa-east-1'
  WORKDIR: 'remote-backend'
  TF_IN_AUTOMATION: 'true'
  # 비어 있으면 액세스 키로, 값이 있으면 OIDC 로 인증합니다.
  # secrets 컨텍스트는 step 의 if 조건에서 쓸 수 없어 env 로 옮겨 둡니다.
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
  # main.tf 의 bucket_name / lock_table_name 변수를 Secret 으로 주입합니다.
  TF_VAR_bucket_name: ${{ secrets.TF_BACKEND_BUCKET }}
  TF_VAR_lock_table_name: ${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}

concurrency:
  group: terraform-remote-backend
  cancel-in-progress: false

jobs:
  terraform:
    name: ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      # ==========================================================================================
      # 3. 소스 코드 체크아웃
      # ==========================================================================================
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v7

      # ==========================================================================================
      # 4. 도구 설치
      # ==========================================================================================
      - name: 도구 설치 (Terraform)
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: true

      # ==========================================================================================
      # 5. AWS 인증 정보 설정
      # ==========================================================================================
      # OIDC 방식. AWS_ROLE_ARN Secret 이 등록되어 있으면 이쪽이 돕니다.
      # GitHub 이 발급한 서명 토큰으로 역할을 가져오므로 보관되는 키가 없습니다.
      - name: AWS 인증 (OIDC - 권장)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      # 액세스 키 방식(구). AWS_ROLE_ARN 이 아직 없을 때만 돕니다.
      # OIDC 로 넘어간 뒤에는 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY Secret 을 삭제하세요.
      - name: AWS 인증 (액세스 키 - 폴백)
        if: env.AWS_ROLE_ARN == ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 인증 확인
        run: aws sts get-caller-identity

      # ==========================================================================================
      # 6. 테라폼 초기화
      #    backend 의 bucket / dynamodb_table 은 코드에 없으므로 Secret 으로 주입합니다.
      # ==========================================================================================
      - name: 테라폼 초기화 (init)
        run: |
          terraform init -input=false -no-color \
            -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_BACKEND_DYNAMODB_TABLE }}"

      # ==========================================================================================
      # 7. 테라폼 코드 포맷 / 문법 검증
      # ==========================================================================================
      - name: 포맷 검사 (fmt)
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: true

      - name: 문법 검증 (validate)
        run: terraform validate -no-color

      # ==========================================================================================
      # 8. 변경 미리보기 (plan)
      # ==========================================================================================
      - name: 변경 미리보기 (plan)
        id: plan
        # tee 로 파일에도 남깁니다. 아래 요약 단계가 이 파일을 읽습니다.
        #
        # set -o pipefail 이 없으면 파이프라인의 종료 코드가 tee 의 것이 되어,
        # terraform plan 이 실패해도 이 단계가 성공으로 처리됩니다.
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -lock-timeout=5m -out=tfplan | tee plan.txt

      # plan 출력을 파일로 넘깁니다.
      #
      # [이전 방식이 왜 깨졌나]
      # steps.plan.outputs.stdout 을 env 로 넘겼더니, 생성 리소스가 90개가 넘는
      # 큰 plan 에서 환경변수가 OS 한계를 넘어 bash 가 시작조차 못 했습니다.
      #   An error occurred trying to start process '/usr/bin/bash' ... Argument list too long
      # 작은 plan 에서는 통과해서 한동안 모르고 지나갔습니다.
      # 파일로 주고받으면 크기와 무관하게 동작합니다.
      - name: plan 결과를 실행 요약에 출력
        if: always() && hashFiles(format('{0}/plan.txt', env.WORKDIR)) != ''
        run: |
          {
            echo '### Terraform Plan (remote-backend)'
            echo '```terraform'
            head -c 900000 plan.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ==========================================================================================
      # 9. 인프라 반영 (apply)
      #    action=apply 를 고른 경우에만, 8단계에서 저장한 tfplan 을 그대로 적용합니다.
      # ==========================================================================================
      - name: 인프라 반영 (apply)
        if: github.event.inputs.action == 'apply'
        run: terraform apply -input=false -no-color -lock-timeout=5m -auto-approve tfplan
