<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodePipeline 배포 확인</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 2rem;
           background: #0f172a; color: #e2e8f0; }
    .box { max-width: 42rem; margin: 3rem auto; background: #1e293b;
           border-radius: 12px; padding: 2rem; }
    h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
    dl { display: grid; grid-template-columns: max-content 1fr; gap: .75rem 1.5rem; margin: 0; }
    dt { color: #94a3b8; }
    dd { margin: 0; font-family: ui-monospace, monospace; word-break: break-all; }
    .ok { color: #4ade80; }
  </style>
</head>
<body>
  <div class="box">
    <h1><span class="ok">&#10003;</span> CodePipeline &rarr; CodeDeploy &rarr; EC2</h1>
    <dl>
      <dt>배포 커밋</dt><dd>__COMMIT__</dd>
      <dt>빌드 시각</dt><dd>__BUILT_AT__</dd>
      <dt>경로</dt><dd>GitHub &rarr; CodePipeline &rarr; CodeBuild &rarr; CodeDeploy &rarr; EC2</dd>
    </dl>
  </div>
</body>
</html>
